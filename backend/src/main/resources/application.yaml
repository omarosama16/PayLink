spring:
  application:
    name: paylink-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paylink}
    username: ${SPRING_DATASOURCE_USERNAME:paylink}
    password: ${SPRING_DATASOURCE_PASSWORD:paylink_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info